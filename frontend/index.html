<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>MEW</title>
    <!-- Appearance settings, applied before the first paint so the saved look
         never flashes the default rose. -->
    <script>
        (function () {
            var root = document.documentElement;
            var appearance = {};
            try {
                appearance = JSON.parse(localStorage.getItem('mew_appearance') || '{}') || {};
            } catch (e) {
                appearance = {};
            }

            var hue = typeof appearance.hue === 'number'
                ? appearance.hue
                : localStorage.getItem('mew_accent_hue');
            if (hue !== null && hue !== undefined && hue !== '') {
                root.style.setProperty('--hue', String(hue));
            }

            if (appearance.neutral === true || localStorage.getItem('mew_neutral') === '1') {
                root.dataset.neutral = '1';
            }
            if (appearance.glass === true) root.dataset.glass = '1';
            if (appearance.side === 'right') root.dataset.side = 'right';

            if (typeof appearance.backdrop === 'string' && appearance.backdrop) {
                root.style.setProperty('--app-backdrop', 'url("' + appearance.backdrop + '")');
            }

            if (typeof appearance.font === 'string' && appearance.font) {
                var stack = '"' + appearance.font + '", \'Segoe UI\', system-ui, sans-serif';
                root.style.setProperty('--font-body', stack);
                root.style.setProperty('--font-pixel', stack);
            }

            if (typeof appearance.css === 'string' && appearance.css) {
                var style = document.createElement('style');
                style.id = 'mew-custom-css';
                style.textContent = appearance.css;
                document.head.appendChild(style);
            }
        })();
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div id="app"></div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
