name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Use the latest bedrock-skin
        shell: bash
        working-directory: frontend
        run: |
          npm install bedrock-skin@latest
          npm ls bedrock-skin

      - name: Build
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          wails build -upx -ldflags "-s -w -X main.currentVersion=$VERSION"

      # update.exe is its own module: it downloads the new mew.exe, swaps it in
      # and starts it again.
      - name: Build the updater
        shell: bash
        run: |
          cd update
          go build -ldflags "-s -w -H windowsgui" -o ../build/bin/update.exe .

      - name: Create Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" build/bin/mew.exe build/bin/update.exe \
            --title "MEW $TAG" \
            --generate-notes
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          curl -sS --fail-with-body -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK" <<EOF
          {
            "content": "**MEW ${TAG}** is out!",
            "embeds": [
              {
                "title": "Download MEW ${TAG}",
                "url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}",
                "description": "Windows (x64)",
                "color": 15293772
              }
            ]
          }
          EOF
