name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Use the latest bedrock-skin
        shell: bash
        working-directory: frontend
        run: |
          npm install bedrock-skin@latest
          npm ls bedrock-skin

      - name: Build
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          wails build -upx -ldflags "-s -w -X main.currentVersion=$VERSION"

      # go vet and go test need frontend/dist, which wails build just produced,
      # so they run here rather than in a separate workflow.
      - name: Vet and test
        shell: bash
        run: |
          go vet ./...
          go test ./...
          cd update
          go vet ./...
          go test ./...

      # update.exe is its own module: it downloads the new mew.exe, swaps it in
      # and starts it again.
      - name: Build the updater
        shell: bash
        run: |
          cd update
          go build -ldflags "-s -w -H windowsgui" -o ../build/bin/update.exe .

      - name: Create Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" build/bin/mew.exe build/bin/update.exe \
            --title "MEW $TAG" \
            --generate-notes
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The Discord embed carries the same notes the app shows, so the entry for
      # this tag has to exist in CHANGELOG.md.
      - name: Read the changelog for this release
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          NOTES="$(awk -v v="$VERSION" '
            /^## / {
              if (on) exit
              if ($0 == "## " v) { on = 1; next }
            }
            on { print }
          ' CHANGELOG.md)"
          NOTES="$(printf '%s\n' "$NOTES" | sed -e '/./,$!d')"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="No changelog entry for $VERSION."
          fi
          printf '%s\n' "$NOTES" > "${RUNNER_TEMP}/release-notes.md"
          echo "notes for $VERSION: ${#NOTES} characters"

      - name: Notify Discord
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          python - <<'PY'
          import json, os, urllib.request

          tag = os.environ["TAG"]
          notes = open(os.environ["NOTES_FILE"], encoding="utf-8").read().strip()
          # Discord caps an embed description at 4096 characters.
          if len(notes) > 4000:
              notes = notes[:4000].rstrip() + "\n…"

          payload = {
              "content": f"**MEW {tag}** is out!",
              "embeds": [
                  {
                      "title": f"Download MEW {tag}",
                      "url": os.environ["RELEASE_URL"],
                      "description": notes,
                      "footer": {"text": "Windows (x64)"},
                      "color": 15293772,
                  }
              ],
          }

          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request) as response:
              print("discord responded", response.status)
          PY
