name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Use the latest bedrock-skin
        shell: bash
        working-directory: frontend
        run: |
          npm install bedrock-skin@latest
          npm ls bedrock-skin

      - name: Build
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          wails build -upx -ldflags "-s -w -X main.currentVersion=$VERSION"

      - name: Create Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" build/bin/mew.exe \
            --title "MEW $TAG" \
            --generate-notes
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }}
        run: |
          export TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 -c "
          import json, sys, os
          payload = {
            'content': '<@&1530333141548404786>',
            'embeds': [{
              'title': 'MEW ' + os.environ['TAG'] + ' Released!',
              'url': os.environ['RELEASE_URL'],
              'color': 15293772,
              'description': 'A new version of **MEW** is now available!\n\n[Download ' + os.environ['TAG'] + '](' + os.environ['RELEASE_URL'] + ')',
              'fields': [
                {'name': 'Version', 'value': os.environ['TAG'], 'inline': True},
                {'name': 'Platform', 'value': 'Windows (x64)', 'inline': True}
              ],
              'footer': {'text': 'MEW - Minecraft Bedrock Texture Pack Manager'},
              'timestamp': os.environ['TIMESTAMP']
            }]
          }
          json.dump(payload, sys.stdout)
          " > /tmp/payload.json
          curl -H "Content-Type: application/json" -d @/tmp/payload.json "$DISCORD_WEBHOOK"
